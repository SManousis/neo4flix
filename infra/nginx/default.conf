map $http_x_request_id $neo4flix_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
}

limit_req_zone $binary_remote_addr zone=expensive:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Request-Id $neo4flix_request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self';" always;
    limit_req_status 429;
    proxy_hide_header X-Request-Id;
    proxy_set_header X-Request-Id $neo4flix_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No URI suffix on proxy_pass: preserve each canonical API path.
    location ~ ^/api/v1/auth(?:/|$) {
        proxy_pass http://user-service:8081;
    }
    location ~ ^/api/v1/users(?:/|$) {
        proxy_pass http://user-service:8081;
    }
    location ~ ^/api/v1/movies(?:/|$) {
        limit_req zone=expensive burst=20 nodelay;
        proxy_pass http://movie-service:8082;
    }
    location ~ ^/api/v1/genres(?:/|$) {
        proxy_pass http://movie-service:8082;
    }
    location ~ ^/api/v1/ratings(?:/|$) {
        proxy_pass http://rating-service:8083;
    }
    location ~ ^/api/v1/recommendations(?:/|$) {
        limit_req zone=expensive burst=20 nodelay;
        proxy_pass http://recommendation-service:8084;
    }
    location ~ ^/api/v1/recommendation-shares(?:/|$) {
        proxy_pass http://recommendation-service:8084;
    }
    location ~ ^/api/v1/shares(?:/|$) {
        proxy_pass http://recommendation-service:8084;
    }
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
