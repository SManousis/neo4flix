spring:
  application:
    name: movie-service
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:change-me}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

neo4flix:
  recommendation:
    base-url: ${NEO4FLIX_RECOMMENDATION_BASE_URL:http://recommendation-service:8084}
    connect-timeout-millis: ${NEO4FLIX_RECOMMENDATION_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${NEO4FLIX_RECOMMENDATION_READ_TIMEOUT_MILLIS:5000}
  security:
    jwt:
      public-key: ${NEO4FLIX_JWT_PUBLIC_KEY:}
      issuer: ${NEO4FLIX_JWT_ISSUER:neo4flix-user-service}
      audience: ${NEO4FLIX_JWT_AUDIENCE:neo4flix-api}
