<section class="auth-page" aria-labelledby="two-factor-title">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title id="two-factor-title">Two-factor verification</mat-card-title>
      <mat-card-subtitle>Enter the six-digit code from your authenticator app.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Authentication code</mat-label>
          <input
            matInput
            data-testid="two-factor-code"
            formControlName="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
          />
          @if (form.controls.code.touched && form.controls.code.invalid) {
            <mat-error>Enter exactly six digits.</mat-error>
          }
        </mat-form-field>
        <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Verifying…' : 'Verify' }}
        </button>
        <button mat-button type="button" (click)="cancel()">Back to sign in</button>
      </form>
    </mat-card-content>
  </mat-card>
</section>
